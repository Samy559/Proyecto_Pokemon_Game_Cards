<div class="coleccion-container">
  <header class="coleccion-header">
    <div>
      <h1>Colección de Cartas</h1>
      <p>Cartas generadas usando la API de Pokémon</p>
    </div>

    <a routerLink="/menu" class="btn-volver">Volver al menú</a>
  </header>

  <div *ngIf="cargando" class="mensaje">
    Cargando cartas...
  </div>

  <div *ngIf="error" class="mensaje error">
    {{ error }}
  </div>

  <div class="grid-cartas" *ngIf="!cargando && !error">
    <div *ngFor="let carta of cartas" class="carta-wrapper">
      <app-carta-pokemon 
        [carta]="carta" 
        modo="completa"
        [class.carta-bloqueada]="!coleccionService.poseeCarta(carta.id)">
      </app-carta-pokemon>
      <div class="cantidad-badge" *ngIf="coleccionService.poseeCarta(carta.id)">
        x{{ coleccionService.cantidadPoseida(carta.id) }}
      </div>
    </div>
  </div>
</div>
